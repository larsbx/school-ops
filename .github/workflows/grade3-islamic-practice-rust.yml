name: Grade 3 Islamic practice (Rust)

# Advisory change-scoped acceptance; do not configure this path-filtered check as
# a required status: GitHub can leave skipped checks pending on unrelated PRs.
on:
  pull_request:
    paths:
      - 'curriculum/islamic-studies/grade-3-source-literacy-pilot/rust/**'
      - '.github/workflows/grade3-islamic-practice-rust.yml'
  push:
    branches: [main]
    paths:
      - 'curriculum/islamic-studies/grade-3-source-literacy-pilot/rust/**'
      - '.github/workflows/grade3-islamic-practice-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-practice:
    name: Rust practice / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Compile and exercise the source-safe draft generator
        run: cargo test --manifest-path curriculum/islamic-studies/grade-3-source-literacy-pilot/rust/Cargo.toml --all-targets
      - name: Rust formatting
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --manifest-path curriculum/islamic-studies/grade-3-source-literacy-pilot/rust/Cargo.toml --all -- --check
      - name: Rust lint and type checks
        if: matrix.os == 'ubuntu-24.04'
        run: cargo clippy --manifest-path curriculum/islamic-studies/grade-3-source-literacy-pilot/rust/Cargo.toml --all-targets -- -D warnings
      - name: End-to-end new and read-only resume (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          manifest=curriculum/islamic-studies/grade-3-source-literacy-pilot/rust/Cargo.toml
          output="$RUNNER_TEMP/g3-is-rust-session"
          cargo run --quiet --manifest-path "$manifest" -- new --output "$output"
          test -s "$output/learner.md"
          test -s "$output/teacher.md"
          test -s "$output/manifest.json"
          before="$(sha256sum "$output/learner.md" "$output/teacher.md" "$output/manifest.json")"
          cargo run --quiet --manifest-path "$manifest" -- resume --output "$output"
          test "$before" = "$(sha256sum "$output/learner.md" "$output/teacher.md" "$output/manifest.json")"
          if cargo run --quiet --manifest-path "$manifest" -- new --output "$output"; then
            echo "ERROR: new form overwrote existing output" >&2
            exit 1
          fi
          printf 'tampered\n' >> "$output/learner.md"
          if cargo run --quiet --manifest-path "$manifest" -- resume --output "$output"; then
            echo "ERROR: tampering was not rejected" >&2
            exit 1
          fi

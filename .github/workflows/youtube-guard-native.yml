name: SchoolOps YouTube Guard native wizard bundles

on:
  pull_request:
    paths:
      - 'tools/browser/site_scoped_youtube_guard/wizard.py'
      - 'tools/browser/site_scoped_youtube_guard/installer_core.py'
      - 'tools/browser/site_scoped_youtube_guard/platform_policy.py'
      - 'tools/browser/site_scoped_youtube_guard/crx3.py'
      - 'tools/browser/site_scoped_youtube_guard/release_core.py'
      - 'tests/test_guard_release.py'
      - 'tests/test_guard_release_wizard.py'
      - 'tests/test_guard_platform_policy.py'
      - 'tools/browser/site_scoped_youtube_guard/build_rules.py'
      - 'tools/browser/site_scoped_youtube_guard/package_native.py'
      - 'tools/browser/site_scoped_youtube_guard/manifest.json'
      - 'tests/test_native_youtube_wizard.py'
      - 'tests/test_youtube_guard_installer.py'
      - 'tools/browser/site_scoped_youtube_guard/smoke_gui.py'
      - '.github/workflows/youtube-guard-native.yml'
  push:
    branches: [main]
    paths:
      - 'tools/browser/site_scoped_youtube_guard/**'
      - '.github/workflows/youtube-guard-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-wizard:
    name: Unsigned native wizard (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # The repository and generated fixtures use UTF-8 on every platform.
      PYTHONUTF8: '1'
    steps:
      - name: Preserve committed fixture bytes on checkout
        # Hash checks must see Git's LF bytes, including on Windows runners.
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select OpenSSL 3 on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          openssl_prefix="$(brew --prefix openssl@3)"
          test -x "$openssl_prefix/bin/openssl"
          echo "$openssl_prefix/bin" >> "$GITHUB_PATH"
      - name: Require actual OpenSSL signing and certificate support
        shell: bash
        run: |
          openssl version
          python -c 'import subprocess; assert subprocess.check_output(["openssl", "version"], text=True).startswith("OpenSSL 3."), "OpenSSL 3 is required"'
      - name: Install pinned native packager
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.22.3"
      - name: Validate Python contracts
        run: python -m unittest discover -s tests -v
      - name: Install Linux virtual-display dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Smoke-test interactive Tkinter wizard on a virtual display
        if: matrix.os == 'ubuntu-24.04'
        run: xvfb-run -a python tools/browser/site_scoped_youtube_guard/smoke_gui.py
      - name: Build and smoke-test unsigned native wizard
        run: python tools/browser/site_scoped_youtube_guard/package_native.py --output-dir native-wizard-output
      - name: Upload unsigned build and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schoolops-youtube-guard-${{ matrix.os }}-unsigned
          path: native-wizard-output/
          if-no-files-found: warn
          retention-days: 14
